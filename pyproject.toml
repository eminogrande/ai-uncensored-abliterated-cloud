[project]
name = "abliterated-website"
version = "0.12.0"
description = "Local development checks for the ABLITERATED.cloud website"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive", ".venv", "node_modules"]
